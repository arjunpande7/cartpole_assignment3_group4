name: adaptive

total_steps: 300000        
episode_cap: 2000         

# DQN hyperparameters
learning_rate: 0.0005
gamma: 0.99
buffer_size: 100000
batch_size: 64
learning_starts: 5000      
target_update: 1000        
grad_clip: 10

epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 100000

sampler:
  type: adaptive           
  low: 0.4
  high: 1.8
  n_bins: 15
  mix: 0.2
  temperature: 0.2
  alpha: 0.1
  cap: 2000

# reward (factor 2)
reward:
  type: standard           
  lambda: 0.5